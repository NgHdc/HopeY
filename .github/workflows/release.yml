# Khi đẩy tag vX.Y.Z: tạo GitHub Release từ CHANGELOG.md, rồi chạy Deploy (thêm /v/X.Y.Z/).
# Khi đẩy nhánh dev: chạy Deploy để cập nhật /next/.
# Chạy tay (Actions → Release → Run workflow): tạo bù Release cho một tag.
#   (GitHub bỏ qua sự kiện tag khi đẩy hơn 3 tag cùng lúc.)
# Deploy chỉ chạy trên main vì môi trường github-pages chỉ cho phép nhánh mặc định.
name: Release

on:
  push:
    tags: ['v*']
    branches: [dev]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag cần tạo Release (vd v0.3.0)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tạo GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag không hợp lệ: $TAG"; exit 1; }
          node scripts/changelog.mjs "$TAG" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag || gh release edit "$TAG" --notes-file notes.md
      - name: Chạy Deploy
        run: gh workflow run deploy.yml --ref main
