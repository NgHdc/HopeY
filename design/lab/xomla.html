<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab Xóm lạ · Phố Giấy</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../../src/style.css"><link rel="stylesheet" href="../themes/vietnam.css"><link rel="stylesheet" href="../themes/components.css"><link rel="stylesheet" href="../themes/xomla.css"></head>
<body data-map="vietnam"><nav class="xl-toolbar"><strong>Lab Xóm lạ</strong><button data-page="board" aria-pressed="true">Bàn cờ</button><button data-page="lobby">Sảnh</button><button data-page="end">Kết thúc</button><button id="pass">Chuyền máy</button><button id="mobile">Xem 390px</button><span>Dữ liệu minh họa · vòng 5 / 12</span></nav>
<div class="xl-layout" id="layout"><section id="boardPage" class="xl-section active"><div id="game"></div></section>
<section id="lobbyPage" class="xl-section"><div class="xl-card"><h2>Chọn cuộc chơi</h2><div class="xl-moves"><button data-preset="classic">Cổ điển</button><button data-preset="xomla" class="selected">Xóm lạ</button></div><div id="switches"></div></div></section>
<section id="endPage" class="xl-section"><div class="xl-card"><h2>Uy tín cuối xóm · 12 vòng</h2><table class="xl-rank"><thead><tr><th>Hạng</th><th>Người</th><th>Kiểu chơi</th><th>Tài sản</th><th>Khai hoang</th><th>Lệ</th><th>Hội làng</th><th>Tổng</th></tr></thead><tbody><tr><td>1</td><td>Lan</td><td>Thám tử</td><td>18</td><td>2</td><td>10</td><td>3</td><td>33</td></tr><tr><td>2</td><td>Minh</td><td>Địa chủ</td><td>26</td><td>1</td><td>0</td><td>2</td><td>29</td></tr><tr><td>3</td><td>An</td><td>Liều ăn nhiều</td><td>14</td><td>2</td><td>0</td><td>7</td><td>23</td></tr><tr><td>4</td><td>Bình</td><td>Người khai hoang</td><td>13</td><td>3</td><td>0</td><td>2</td><td>18</td></tr></tbody></table></div></section></div>
<div id="modal" class="xl-overlay" hidden><div class="xl-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalBody"></div></div></div>
<script type="module">
import {createGame} from '../../src/core/rules.js';import {gameHtml} from '../../src/ui/view.js';import {loadStacks,drawStack} from '../../src/render/stack.js';
const S=createGame(['Lan','Minh','An','Bình'],{map:'vietnam',seed:20261128});S.players.forEach((p,i)=>{p.pos=[2,9,16,24][i];p.piece=i});S.view={kind:'tile',i:5};S.round=5;
const ctx={mode:'local',room:'LAB',me:0,mine:false,busy:false,tab:'land',version:'lab',dev:false,bet:50,pos:null,banner:'',viewOverride:null};
const game=document.querySelector('#game');game.innerHTML=gameHtml(S,ctx);const board=game.querySelector('.board');const tile=i=>board.querySelector(`[data-tile="${i}"]`);
const seen=new Set([0,10,20,30,2,9,16,24]);for(let i=0;i<40;i++)if(!seen.has(i))tile(i)?.classList.add('xl-fog');
const side=game.querySelector('.side');side.insertAdjacentHTML('afterbegin',`<section class="xl-card"><h2>Uy tín · vòng 5 / 12</h2><table class="xl-score"><thead><tr><th>Người</th><th>Tài sản</th><th>Khai hoang</th><th>Lệ</th><th>Hội làng</th><th>Tổng</th></tr></thead><tbody><tr><td>Lan</td><td>18</td><td>2</td><td>5</td><td>1</td><td>26</td></tr><tr><td>Minh</td><td>20</td><td>1</td><td>0</td><td>2</td><td>23</td></tr><tr><td>An</td><td>14</td><td>2</td><td>0</td><td>4</td><td>20</td></tr><tr><td>Bình</td><td>13</td><td>3</td><td>0</td><td>1</td><td>17</td></tr></tbody></table></section><section class="xl-card"><h2>Chọn cách đi · xúc xắc 3 + 4</h2><div class="xl-moves"><button data-step="7">Đi 7 (tổng)</button><button data-step="3">Đi 3</button><button data-step="4">Đi 4</button></div><p id="moveHint">Chọn để xem ô đích sáng lên.</p></section><section class="xl-card"><h2>Hội làng</h2><div class="xl-moves"><button data-game="auction">Đấu giá kín</button><button data-game="baucua">Bầu cua</button><button data-game="market">Đoán giá chợ</button></div></section>`);
side.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{board.querySelectorAll('.xl-destination').forEach(x=>x.classList.remove('xl-destination'));const to=(S.players[0].pos+Number(b.dataset.step))%40;tile(to)?.classList.add('xl-destination');document.querySelector('#moveHint').textContent=`Đi ${b.dataset.step} → ô ${to+1}${seen.has(to)?' đã biết':' còn trong sương'}`});
let stacks=false;try{await loadStacks('../../assets/stacks/manifest.json');stacks=true}catch(e){console.warn('Chưa nạp được địa danh',e)}
function reveal(i){const el=tile(i);if(!el||seen.has(i))return;seen.add(i);el.classList.remove('xl-fog');el.classList.add('xl-reveal');setTimeout(()=>el.classList.remove('xl-reveal'),520);if(stacks&&i===5){const canvas=document.createElement('canvas');canvas.width=90;canvas.height=90;canvas.className='xl-landmark';el.append(canvas);try{drawStack(canvas.getContext('2d'),'hn-ho-hoan-kiem-pixel',0,45,75,{scale:.6})}catch(e){console.warn(e)}}}
board.addEventListener('click',e=>{const el=e.target.closest('[data-tile]');if(el)reveal(Number(el.dataset.tile))});
const modal=document.querySelector('#modal'),body=document.querySelector('#modalBody');let timer;
function open(html){clearInterval(timer);body.innerHTML=html;modal.hidden=false;const time=body.querySelector('#clock');let left=25;if(time){time.textContent=left;timer=setInterval(()=>{left=Math.max(0,left-1);time.textContent=left;if(!left)clearInterval(timer)},1000)}}function close(){modal.hidden=true;clearInterval(timer)}
const wait='<div class="xl-wait">Đã chọn 2/4 người · Lan ✓ · Minh ✓ · An ○ · Bình ○<br>Chỉ hiện ai đã chọn, chưa lộ lựa chọn.</div>';
function auction(){open(`<h2 id="modalTitle">Đấu giá kín <small>⏱ <span id="clock"></span>s</small></h2><div class="xl-card"><b>Ô đất vừa mở: Hồ Hoàn Kiếm</b><p>Giá niêm yết 200 · mỗi người ghi kín một giá.</p></div><label>Giá của bạn <input id="bid" type="number" min="100" step="10" value="150"></label> <button id="choose">Ghi giá</button>${wait}<button id="flip">Lật kết quả</button> <button id="close">Đóng</button>`);body.querySelector('#choose').onclick=()=>{body.querySelector('.xl-wait').firstChild.textContent='Đã chọn 3/4 người · ';body.querySelector('#bid').disabled=true};body.querySelector('#flip').onclick=()=>{body.innerHTML='<h2 id="modalTitle">Giá đã lật</h2><table class="xl-rank"><tr><th>Lan</th><td>150</td></tr><tr><th>Minh</th><td>180</td></tr><tr><th>An</th><td>120</td></tr><tr><th>Bình</th><td>160</td></tr></table><p><b>Minh thắng, trả 180.</b></p><button id="close">Đóng</button>';body.querySelector('#close').onclick=close};body.querySelector('#close').onclick=close}
function baucua(){open(`<h2 id="modalTitle">Bầu cua <small>⏱ <span id="clock"></span>s</small></h2><p>Chọn 1–2 mặt, tối thiểu 10 mỗi mặt.</p><div class="xl-options" id="animals">${['Bầu','Cua','Tôm','Cá','Gà','Nai'].map(x=>`<button data-animal="${x}">${x}</button>`).join('')}</div><label>Tiền mỗi mặt <input id="stake" type="number" min="10" step="10" value="10"></label><button id="choose">Đặt tiền</button>${wait}<button id="flip">Lắc và lật</button> <button id="close">Đóng</button>`);body.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>{const selected=body.querySelectorAll('.xl-options .selected');if(!b.classList.contains('selected')&&selected.length>=2)return;b.classList.toggle('selected')});body.querySelector('#choose').onclick=()=>{const amount=Number(body.querySelector('#stake').value);if(amount<10||!body.querySelector('.xl-options .selected'))return;body.querySelector('.xl-wait').firstChild.textContent='Đã chọn 3/4 người · '};body.querySelector('#flip').onclick=()=>{body.innerHTML='<h2 id="modalTitle">Ba hột đã lăn</h2><p class="xl-options"><b>🦀 Cua</b><b>🐟 Cá</b><b>🦀 Cua</b></p><table class="xl-rank"><tr><th>Lan</th><td>+20</td></tr><tr><th>Minh</th><td>−10</td></tr><tr><th>An</th><td>+10</td></tr><tr><th>Bình</th><td>−20</td></tr></table><button id="close">Đóng</button>';body.querySelector('#close').onclick=close};body.querySelector('#close').onclick=close}
function market(){open(`<h2 id="modalTitle">Đoán giá chợ <small>⏱ <span id="clock"></span>s</small></h2><p>Chọn số từ 0 đến 100, gần 2/3 trung bình nhất thì thắng.</p><input id="range" type="range" min="0" max="100" value="42"><input id="number" type="number" min="0" max="100" value="42"><button id="choose">Ghi số</button>${wait}<button id="flip">Lật kết quả</button> <button id="close">Đóng</button>`);const range=body.querySelector('#range'),number=body.querySelector('#number');range.oninput=()=>number.value=range.value;number.oninput=()=>range.value=Math.max(0,Math.min(100,Number(number.value)));body.querySelector('#choose').onclick=()=>{body.querySelector('.xl-wait').firstChild.textContent='Đã chọn 3/4 người · '};body.querySelector('#flip').onclick=()=>{body.innerHTML='<h2 id="modalTitle">Giá chợ đã lật</h2><div class="xl-axis"><i style="left:26%" data-label="An 26"></i><i style="left:34%" data-label="Bình 34"></i><i style="left:38%;background:var(--bad)" data-label="2/3 TB: 38"></i><i style="left:42%" data-label="Lan 42"></i><i style="left:50%" data-label="Minh 50"></i></div><p><b>Lan gần vạch nhất: +1 uy tín.</b></p><button id="close">Đóng</button>';body.querySelector('#close').onclick=close};body.querySelector('#close').onclick=close}
side.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>({auction,baucua,market})[b.dataset.game]());
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.xl-section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.page+'Page'));document.querySelectorAll('[data-page]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.querySelector('#mobile').onclick=e=>{const yes=document.querySelector('#layout').classList.toggle('mobile');e.target.textContent=yes?'Xem 1440px':'Xem 390px'};
document.querySelector('#pass').onclick=()=>{open('<div class="xl-pass"><h2 id="modalTitle">Đưa máy cho <b>Lan</b></h2><p>Bàn cờ và các lựa chọn đang được che kín.</p><button id="resume">Tôi là Lan, xem</button></div>');body.querySelector('#resume').onclick=close};
const opts={fog:true,village:true,custom:true,end:true};const labels={fog:'Bàn ẩn',village:'Hội làng',custom:'Lệ làng',end:'Kết thúc sau 12 vòng bằng uy tín'};
function switches(){document.querySelector('#switches').innerHTML=Object.keys(opts).map(k=>`<label class="xl-switch">${labels[k]} <input type="checkbox" data-option="${k}" ${opts[k]?'checked':''}></label>`).join('');document.querySelectorAll('[data-option]').forEach(c=>c.onchange=()=>opts[c.dataset.option]=c.checked)}switches();
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const on=b.dataset.preset==='xomla';Object.keys(opts).forEach(k=>opts[k]=on);switches();document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('selected',x===b))});
</script></body></html>
