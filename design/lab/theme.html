<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phố Giấy · Lab theme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&family=VT323&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif:ital,wght@1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../../src/style.css">
  <link rel="stylesheet" href="../themes/vietnam.css">
  <link rel="stylesheet" href="../themes/classic.css">
  <link rel="stylesheet" href="../themes/components.css">
  <link rel="stylesheet" href="../themes/sprite.css">
  <style>
    body { min-width: 320px; background-color: var(--bg); background-image: var(--bg-pattern); }
    .lab-shell { max-width: 1600px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 48px) 56px; }
    .lab-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
    .lab-kicker { color: var(--ink-2); font: 12px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; }
    .lab-title { color: var(--ink); font: 700 clamp(32px, 4vw, 54px)/1 var(--font-display); margin: 4px 0 0; }
    .lab-description { max-width: 440px; margin: 0; color: var(--ink-2); }
    .lab-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-block: var(--border); padding: 14px 0; margin-bottom: 20px; }
    .lab-toolbar .lab-label { color: var(--ink-2); font: 12px var(--font-mono); margin-right: 3px; }
    .lab-toolbar button { min-height: 42px; padding: 7px 14px; border: var(--border); border-radius: var(--radius-lg); background: var(--surface); color: var(--ink); font-weight: 700; cursor: pointer; }
    .lab-toolbar button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow); }
    .lab-toolbar select { min-height: 42px; border: var(--border); border-radius: var(--radius-md); padding: 6px 10px; background: var(--surface); color: var(--ink); }
    .lab-toolbar .spacer { flex: 1; }
    .lab-avatar-picker { flex-basis: 100%; display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 5px 2px; }
    .lab-avatar-picker button { flex: 0 0 112px; display: flex; align-items: center; gap: 7px; text-align: left; }
    .lab-avatar-picker button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
    .lab-avatar-picker img { width: 34px; height: 34px; border-radius: 0; background: var(--surface-2); object-fit: cover; image-rendering: pixelated; }
    .avatar-portrait { flex: none; border-radius: 0; border: var(--px) solid var(--ink); background: var(--avatar-color, var(--surface-2)); object-fit: cover; vertical-align: middle; image-rendering: pixelated; }
    .avatar-token { flex: none; object-fit: contain; vertical-align: middle; }
    .board { position: relative; }
    .lab-walker { position: absolute; z-index: 20; pointer-events: none; }
    .lab-avatar-picker .sprite-portrait { width: 48px; height: 48px; }
    .seat .avatar-portrait { width: 40px; height: 40px; }
    .pl .avatar-portrait { width: 28px; height: 28px; }
    .pieces .avatar-token { width: 15px; height: 15px; }
    .pick .avatar-token { width: 30px; height: 30px; }
    .lab-layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: start; }
    .desktop-panel, .phone-panel { min-width: 0; }
    .panel-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; color: var(--ink); font: 700 20px var(--font-display); }
    .panel-heading small { color: var(--ink-2); font: 11px var(--font-mono); }
    .desktop-stage { min-height: 720px; overflow: hidden; border: var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow); background-color: var(--bg); background-image: var(--bg-pattern); }
    .desktop-stage > #screenRoot { min-height: 720px; }
    .phone-frame { width: min(416px, 100%); height: 844px; padding: 10px; overflow: hidden; border: var(--border); border-radius: 0; background: var(--ink); box-shadow: var(--shadow); margin-inline: auto; }
    .phone-frame iframe { width: 100%; height: 100%; display: block; border: 0; border-radius: 0; background: var(--bg); }
    .map-note { margin-top: 14px; padding: 12px 14px; border: var(--border); border-radius: var(--radius-md); background: var(--surface); color: var(--ink-2); font-size: 13px; }
    .map-note b { color: var(--ink); }
    [data-map] { color: var(--ink); }
    [data-map] .primary { color: var(--on-accent); }
    [data-map] .dice-sum, [data-map] .card .mark { color: var(--on-accent-2); }
    [data-map] .sw.d6 { color: var(--on-d6); }
    body.phone-view { min-height: 100%; }
    body.phone-view #screenRoot { min-height: 100vh; }
    body.phone-view .home-art { background-color: var(--surface-2); }
    @media (max-width: 1040px) {
      .lab-layout { grid-template-columns: minmax(0, 1fr); }
      .phone-panel { display: none; }
    }
    @media (max-width: 760px) {
      .lab-shell { padding: 16px 12px 32px; }
      .lab-description { font-size: 13px; }
      .lab-toolbar { gap: 7px; }
      .lab-toolbar button { min-height: 40px; padding-inline: 11px; }
      .desktop-stage, .desktop-stage > #screenRoot { min-height: 640px; }
    }
  </style>
</head>
<body data-map="vietnam">
  <div id="labShell" class="lab-shell">
    <header class="lab-head">
      <div><div class="lab-kicker">Design lab / Rực rỡ / U1</div><h1 class="lab-title">Hai vùng đất, một bàn cờ</h1></div>
      <p class="lab-description">Các màn hình bên dưới dùng trực tiếp hàm dựng HTML và trạng thái game hiện tại. Chuyển map để so bảng màu, hoa văn và cách chúng phủ lên giao diện.</p>
    </header>
    <nav class="lab-toolbar" aria-label="Tùy chọn xem thử">
      <span class="lab-label">VÙNG ĐẤT</span>
      <button type="button" data-map-choice="vietnam" aria-pressed="true">Dải đất</button>
      <button type="button" data-map-choice="classic" aria-pressed="false">Phố Giấy</button>
      <span class="spacer"></span>
      <span class="lab-label">MÀN HÌNH</span>
      <select id="screenChoice" aria-label="Chọn màn hình">
        <option value="home">Trang đầu</option><option value="lobby">Sảnh chờ</option>
        <option value="game">Bàn cờ đang chơi</option><option value="end">Kết thúc ván</option>
      </select>
      <div id="avatarPicker" class="lab-avatar-picker" role="group" aria-label="Chọn avatar ghế của bạn"></div>
      <div id="spriteControls" class="lab-avatar-picker" role="group" aria-label="Thử hoạt ảnh sprite">
        <button type="button" data-anim-choice="idle">idle</button>
        <button type="button" data-anim-choice="walk">walk</button>
        <button type="button" data-anim-choice="happy">happy</button>
        <button type="button" data-anim-choice="sad">sad</button>
        <button type="button" id="walkFive">Đi 5 ô</button>
      </div>
    </nav>
    <main class="lab-layout">
      <section class="desktop-panel" aria-label="Xem trên màn hình lớn">
        <h2 class="panel-heading">Màn hình thật <small id="desktopCaption">1280 px · trang đầu</small></h2>
        <div class="desktop-stage"><div id="screenRoot"></div></div>
        <p class="map-note" id="mapNote"></p>
      </section>
      <section class="phone-panel" aria-label="Xem trên điện thoại">
        <h2 class="panel-heading">Khung điện thoại <small>390 × 844 px</small></h2>
        <div class="phone-frame"><iframe id="phonePreview" title="Màn hình ở độ rộng điện thoại 390 pixel"></iframe></div>
      </section>
    </main>
  </div>
  <div id="screenRootPhone" hidden></div>
  <script type="module">
    import * as View from '../../src/ui/view.js';
    import { createGame } from '../../src/core/rules.js';
    import { MAPS } from '../../src/core/maps/index.js';
    import { loadAvatars, portraitHtml, spriteHtml, setAnim } from '../../src/render/sprite.js';

    const params = new URLSearchParams(location.search);
    const embedded = params.get('frame') === 'phone';
    let mapId = MAPS[params.get('map')] ? params.get('map') : 'vietnam';
    let screen = ['home', 'lobby', 'game', 'end'].includes(params.get('screen')) ? params.get('screen') : 'home';
    const avatarParam = Number(params.get('avatar'));
    let selectedAvatar = Number.isInteger(avatarParam) && avatarParam >= 0 && avatarParam < 6 ? avatarParam : 0;
    let currentAnim = ['idle', 'walk', 'happy', 'sad'].includes(params.get('anim')) ? params.get('anim') : 'idle';
    const avatarSets = {};
    const root = document.getElementById('screenRoot');
    const labels = { vietnam: 'Dải đất', classic: 'Phố Giấy' };
    const screenLabels = { home: 'trang đầu', lobby: 'sảnh chờ', game: 'bàn cờ', end: 'kết thúc' };
    const sampleNames = ['Cô Hai', 'Bác Tư', 'Bé Na'];

    function gameState(id) {
      const state = createGame(sampleNames, { map: id, seed: 20261128 });
      state.view = { kind: 'tile', i: 14 };
      state.players[0].pos = 18;
      state.players[1].pos = 23;
      state.players[2].pos = 6;
      state.owner[14] = 0;
      state.houses[14] = 2;
      state.owner[23] = 1;
      return state;
    }

    function avatarForPiece(k, kind) {
      const index = k === 0 ? selectedAvatar : k;
      return (kind === 'portrait' ? portraitHtml(avatarSets[mapId], index, 1) :
        spriteHtml(avatarSets[mapId], index, { anim: k === 0 ? currentAnim : 'idle', scale: 1 })) ??
        View.pieceSvg(k, kind === 'portrait' ? 36 : 24);
    }

    function decorateAvatars() {
      root.querySelectorAll('svg.piece').forEach(svg => {
        const match = svg.getAttribute('style')?.match(/--piece-(\d+)/);
        const k = Number(match?.[1] ?? 0);
        const pick = svg.closest('.pick button');
        const portrait = svg.closest('.seat, .pl');
        const rendered = pick
          ? (portraitHtml(avatarSets[mapId], Number(pick.dataset.arg), 1) ?? View.pieceSvg(k, 30))
          : avatarForPiece(k, portrait ? 'portrait' : 'token');
        svg.outerHTML = rendered;
      });
    }

    function renderAvatarPicker() {
      const picker = document.getElementById('avatarPicker');
      if (!picker) return;
      const entries = avatarSets[mapId] ?? [];
      picker.innerHTML = Array.from({ length: 6 }, (_, k) => {
        const item = entries[k];
        const name = item?.name ?? `Quân ${k + 1}`;
        return `<button type="button" class="btn sm" data-avatar-choice="${k}" aria-pressed="${k === selectedAvatar}" title="${item?.line ?? name}">${portraitHtml(entries, k, 1) ?? View.pieceSvg(k, 34)}<span>${name}</span></button>`;
      }).join('');
      picker.querySelectorAll('[data-avatar-choice]').forEach(button => button.addEventListener('click', () => {
        selectedAvatar = Number(button.dataset.avatarChoice);
        renderCurrent();
      }));
    }

    function renderCurrent() {
      document.body.dataset.map = mapId;
      const game = gameState(mapId);
      const ctx = { mode: 'local', room: 'LAB01', me: 0, mine: true, busy: false,
        tab: 'land', version: '0.6.0', dev: false, bet: 50, pos: null,
        banner: '', viewOverride: null };
      let html;
      if (screen === 'home') {
        html = View.homeHtml({ name: 'Cô Hai', code: '', online: true, hasLocalSave: false,
          devDefault: false, version: '0.6.0', mapId });
      } else if (screen === 'lobby') {
        const seats = sampleNames.map((name, piece) => ({ name, piece, online: true }));
        html = View.lobbyHtml({ room: 'LAB01', url: 'http://127.0.0.1:5173/lab01', seats,
          me: 0, isHost: true, canStart: true, status: 'đã kết nối', statusOk: true, mapId });
      } else if (screen === 'game') {
        html = View.gameHtml(game, ctx);
      } else {
        game.winner = 0;
        game.round = 8;
        game.stats.rent[0] = 420;
        game.stats.rent[1] = 230;
        game.stats.lands[14] = 4;
        game.stats.jails[2] = 1;
        game.stats.worth = [[1500,1500,1500],[1820,1470,1310],[2240,1590,990]];
        game.stats.outRound[1] = 7;
        game.stats.outRound[2] = 6;
        html = View.endHtml(game, ctx);
      }
      root.innerHTML = html;
      decorateAvatars();
      renderAvatarPicker();
      const controls = document.getElementById('spriteControls');
      if (controls) controls.hidden = screen !== 'game';
      if (!embedded) {
        document.getElementById('desktopCaption').textContent = `1280 px · ${screenLabels[screen]}`;
        document.getElementById('mapNote').innerHTML = `<b>${labels[mapId]}</b> · ${mapId === 'vietnam' ? 'nền vàng kem, sóng nước và mây; màu quận theo bảng A1.' : 'nền xanh trời, giấy gấp và chấm lưới; màu quận theo bảng A1.'}`;
        const phone = document.getElementById('phonePreview');
        phone.src = `${location.pathname}?frame=phone&map=${mapId}&screen=${screen}&avatar=${selectedAvatar}&anim=${currentAnim}`;
      }
    }

    await Promise.all(['vietnam', 'classic'].map(async id => {
      avatarSets[id] = await loadAvatars(id, new URL('../../assets/avatars/', location.href).href);
    }));
    async function walkFive() {
      if (screen !== 'game') return;
      const board = root.querySelector('.board');
      const first = board?.querySelector('[data-tile="18"]');
      if (!first) return;
      const list = avatarSets[mapId];
      const walker = document.createElement('div');
      walker.className = 'lab-walker';
      walker.innerHTML = spriteHtml(list, selectedAvatar, { anim: 'walk', scale: 2, label: true }) ?? '';
      const sprite = walker.querySelector('.sprite');
      if (!sprite) return;
      const boardRect = board.getBoundingClientRect();
      const point = tile => {
        const rect = tile.getBoundingClientRect();
        return { x: Math.round(rect.left - boardRect.left + (rect.width - 64) / 2),
          y: Math.round(rect.top - boardRect.top + (rect.height - 64) / 2) };
      };
      let at = point(first);
      walker.style.left = `${at.x}px`; walker.style.top = `${at.y}px`;
      board.append(walker);
      const original = first.querySelector('.pieces .sprite');
      if (original) original.style.visibility = 'hidden';
      for (let i = 19; i <= 23; i++) {
        const tile = board.querySelector(`[data-tile="${i}"]`);
        if (!tile) break;
        const next = point(tile);
        await walker.animate([
          { transform: 'translate(0, 0)' },
          { transform: `translate(${next.x - at.x}px, ${next.y - at.y}px)` },
        ], { duration: 300, easing: 'steps(4, end)' }).finished;
        walker.style.left = `${next.x}px`; walker.style.top = `${next.y}px`;
        if (i === 20) sprite.style.setProperty('--flip', -1);
        at = next;
      }
      setAnim(sprite, 'happy', list, selectedAvatar);
      await new Promise(resolve => setTimeout(resolve, 600));
      walker.remove();
      if (original) original.style.visibility = '';
    }
    if (embedded) {
      document.body.classList.add('phone-view');
      document.getElementById('labShell').remove();
      renderCurrent();
    } else {
      renderCurrent();
      document.querySelectorAll('[data-map-choice]').forEach(button => button.addEventListener('click', () => {
        mapId = button.dataset.mapChoice;
        document.querySelectorAll('[data-map-choice]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        renderCurrent();
      }));
      document.getElementById('screenChoice').addEventListener('change', event => {
        screen = event.target.value;
        renderCurrent();
      });
      document.querySelectorAll('[data-anim-choice]').forEach(button => button.addEventListener('click', () => {
        currentAnim = button.dataset.animChoice;
        renderCurrent();
      }));
      document.getElementById('walkFive').addEventListener('click', walkFive);
    }
  </script>
</body>
</html>
