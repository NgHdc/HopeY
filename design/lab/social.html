<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab xã hội · Phố Giấy</title><link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../../src/style.css"><link rel="stylesheet" href="../themes/vietnam.css"><link rel="stylesheet" href="../themes/components.css"><link rel="stylesheet" href="../themes/social.css">
<style>body{margin:0}.lab-bar{padding:8px 14px;background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:30}.lab-bar button{padding:6px 10px;border:var(--border);background:var(--surface);cursor:pointer}.lab-wrap{max-width:1440px;margin:auto}.lab-wrap.mobile{width:390px;max-width:100%}.lab-wrap.mobile .game{display:block}.lab-wrap.mobile .board-sec,.lab-wrap.mobile .side{max-width:none;width:100%}</style></head>
<body data-map="vietnam"><nav class="lab-bar"><strong>Lab xã hội</strong><button id="size">Xem 390px</button><button id="watch" aria-pressed="false">Làm khán giả</button><button id="network">Mất kết nối</button><button id="demoTalk">Lan đang nói</button><span>Biểu cảm và mic chỉ là bản xem giao diện.</span></nav><div class="lab-wrap" id="wrap"><div id="root"></div></div>
<script type="module">
import {createGame} from '../../src/core/rules.js';import {gameHtml} from '../../src/ui/view.js';
const S=createGame(['Lan','Minh','An','Bình'],{map:'vietnam',seed:20261128});S.players.forEach((p,i)=>{p.pos=[6,13,24,32][i];p.piece=i});S.view={kind:'tile',i:6};
const ctx={mode:'local',room:'LAB',me:0,mine:true,busy:false,tab:'land',version:'lab',dev:false,bet:50,pos:null,banner:'',viewOverride:null};
const root=document.querySelector('#root');root.innerHTML=gameHtml(S,ctx);
const top=root.querySelector('.topbar .r');top.insertAdjacentHTML('afterbegin','<span class="social-net" id="net">Ổn định · 36 ms</span>');
const side=root.querySelector('.side');const players=side.querySelector('.players');
players?.querySelectorAll('.pl').forEach((el,i)=>el.insertAdjacentHTML('beforeend',`<span class="social-badge ${['','', 'watch','lost'][i]}">${['Chủ phòng','', 'Khán giả','Mất kết nối'][i]}</span><span class="social-muted" aria-label="Mic tắt">Mic tắt</span>`));
players?.insertAdjacentHTML('afterend',`<button class="social-chat-toggle" id="chatToggle" type="button">Chat · 2 tin</button><section class="social-chat" id="chat"><h2>Chuyện trong xóm</h2><ol class="social-log" id="messages" aria-live="polite"></ol><form id="chatForm"><input id="message" maxlength="80" placeholder="Gõ tin nhắn (tối đa 80 ký tự)" aria-label="Tin nhắn"><button>Gửi</button></form></section><section class="social-emotes"><h2>Biểu cảm</h2><div class="social-emote-grid" id="emotes"></div></section><section class="social-mic"><button id="mic" type="button" aria-pressed="false">◧ Mic tắt</button><button id="hold" type="button">Giữ để nói</button><span id="micState">Chưa phát tiếng</span></section>`);
const log=document.querySelector('#messages');const history=[];function add(name,text){history.push({name,text});while(history.length>30)history.shift();log.replaceChildren(...history.map(m=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=m.name+': ';li.append(b,document.createTextNode(m.text));return li}));log.scrollTop=log.scrollHeight;document.querySelector('#chatToggle').textContent=`Chat · ${history.length} tin`}
add('Minh','Đi vào ô chưa mở nhé?');add('Lan','Để tôi thử vận may.');
document.querySelector('#chatForm').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#message');const value=input.value.trim().slice(0,80);if(value)add('Bạn',value);input.value=''};
document.querySelector('#chatToggle').onclick=()=>document.querySelector('#chat').classList.toggle('open');
const faces=['smile','laugh','heart','wow','sad','angry','wave','thanks','sleep','expensive'];document.querySelector('#emotes').innerHTML=faces.map((f,i)=>`<button type="button" data-face="${i}" aria-label="Biểu cảm ${f}"><img src="../../assets/ui/emotes/${f}.png" alt=""></button>`).join('');
document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{const tile=root.querySelector('[data-tile="6"] .pieces');const bubble=document.createElement('span');bubble.className='social-bubble';const img=document.createElement('img');img.src=`../../assets/ui/emotes/${faces[Number(b.dataset.face)]}.png`;img.alt=faces[Number(b.dataset.face)];bubble.append(img);tile?.append(bubble);setTimeout(()=>bubble.remove(),2000)});
const mic=document.querySelector('#mic'),hold=document.querySelector('#hold'),state=document.querySelector('#micState');let on=false;function speaking(active){root.querySelectorAll('[data-tile="6"] .pieces,.pl:first-child').forEach(el=>el.classList.toggle('social-speaking',active));state.textContent=active?'Bạn đang nói':'Chưa phát tiếng'}
mic.onclick=()=>{on=!on;mic.setAttribute('aria-pressed',String(on));mic.textContent=on?'🎙 Mic bật':'◧ Mic tắt';if(!on)speaking(false)};
hold.onpointerdown=e=>{e.preventDefault();if(on)speaking(true)};['pointerup','pointercancel','pointerleave'].forEach(ev=>hold.addEventListener(ev,()=>speaking(false)));
document.querySelector('#size').onclick=e=>{const mobile=document.querySelector('#wrap').classList.toggle('mobile');e.target.textContent=mobile?'Xem 1440px':'Xem 390px'};
document.querySelector('#watch').onclick=e=>{const watch=root.classList.toggle('social-spectator');e.target.setAttribute('aria-pressed',String(watch));e.target.textContent=watch?'Trở lại người chơi':'Làm khán giả';root.querySelector('.social-watch')?.remove();if(watch)root.querySelector('.topbar').insertAdjacentHTML('afterend','<div class="social-watch">Bạn đang xem</div>')};
document.querySelector('#network').onclick=()=>{const net=document.querySelector('#net');net.classList.toggle('offline');net.textContent=net.classList.contains('offline')?'Mất kết nối':'Ổn định · 36 ms'};
document.querySelector('#demoTalk').onclick=()=>{root.querySelectorAll('[data-tile="6"] .pieces,.pl:first-child').forEach(el=>el.classList.add('social-speaking'));setTimeout(()=>root.querySelectorAll('.social-speaking').forEach(el=>el.classList.remove('social-speaking')),2000)};
</script></body></html>
