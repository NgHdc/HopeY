<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Hoa văn vùng đất Dải đất (Việt Nam): sóng nước & mây cách điệu nhẹ trên nền vàng kem nắng -->
  <g fill="none" stroke="#D9A84E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.24">
    <!-- Lớp sóng nước hàng trên -->
    <path d="M0 34 Q15 22 30 34 T60 34 T90 34 T120 34"/>
    <path d="M0 44 Q15 32 30 44 T60 44 T90 44 T120 44" opacity="0.65"/>
    <!-- Mây cách điệu giữa ô -->
    <path d="M22 72 C22 65 30 62 36 66 C40 60 50 61 52 68 C58 68 60 75 54 77 L24 77 C19 77 18 72 22 72 Z"/>
    <path d="M82 14 C82 8 89 6 94 9 C97 4 106 5 108 11 C113 11 115 17 110 19 L84 19 C80 19 79 14 82 14 Z"/>
    <!-- Lớp sóng nước hàng dưới lệch nửa chu kỳ -->
    <path d="M0 100 Q15 88 30 100 T60 100 T90 100 T120 100"/>
    <path d="M0 110 Q15 98 30 110 T60 110 T90 110 T120 110" opacity="0.65"/>
  </g>
  <!-- Chấm nắng hoa mai nhỏ rải đều -->
  <g fill="#E8A812" opacity="0.22">
    <circle cx="15" cy="14" r="2.2"/>
    <circle cx="75" cy="68" r="2.2"/>
    <circle cx="105" cy="76" r="1.8"/>
  </g>
</svg>
